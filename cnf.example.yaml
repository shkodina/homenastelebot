telegram:
  token: "PUT_BOT_TOKEN_HERE"
  allowed_ids:
    - 123456789
  proxy:
    enabled: true
    type: socks5
    host: 10.0.0.1
    port: 1080
    username: user
    password: password

nas:
  uptime_path: /proc/uptime
  host_root: /host
  urls_page: http://nas.home/

docker:
  socket: /var/run/docker.sock
  restart_flag: /xtmp-docker/restart
  restart_skip:
    - homenasbot

cursor:
  api_key: "crsr_PUT_USER_API_KEY_HERE"
  nas:
    enabled: true
    job_dir: /xtmp-docker/cursor-nas
    timeout_sec: 1200

ftp:
  service: vsftpd

vsftpd:
  send_on_start:
    send_login_data: true
    send_server_info: true
    send_in_splited_messages: true
  user: "FTP_USER"
  pass: "FTP_PASSWORD"
  endpoints:
    internal: "ftp://192.168.88.25:21"
    external: "ftp://217.15.195.187:54321"
